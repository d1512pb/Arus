# CI de Arus: en cada push/PR compila y prueba el motor CON detector de races
# (go test -race exige CGO + gcc de 64 bits — corre aquí porque la máquina de
# desarrollo Windows no puede) y construye el dashboard de Next.js.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  engine:
    name: Motor Go (vet + build + test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: apps/engine/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  web:
    name: Dashboard Next.js (build + tipos + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test # vitest: layout paramétrico del radar (rediseño Radar-first)
      - run: npm run build
